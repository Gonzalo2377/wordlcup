name: Daily odds robot

# Refresca daily.json cada mañana con cuotas de The Odds API.
# Requiere el secret ODDS_API_KEY (Settings → Secrets and variables → Actions).
# NOTA: este workflow asume que el contenido de la carpeta "mundial/" está en la
# RAÍZ del repositorio (robot/fetch-daily.js, daily.json, index.html en la raíz).
# Si en cambio subes el proyecto con la carpeta "mundial/" dentro, usa el workflow
# de ../../.github/workflows/daily-odds.yml (rutas con prefijo mundial/).

# CRÉDITOS (plan gratis de The Odds API = 500/mes, se renuevan el día 1):
#   · cuotas como mucho UNA vez cada 20 h (ODDS_MIN_HOURS). El Worker de Cloudflare
#     lanza el robot a las 07:00 y este cron también: la ejecución que llegue
#     después solo liquida resultados con ESPN (0 créditos).
#   · solo se piden cuotas de competiciones con partidos en la ventana (comprobarlo es gratis)
#   · 1 crédito por competición (región eu × mercado 1X2); nunca más del cupo diario
#     que queda hasta fin de mes. Normalmente 2-8 créditos/día ≈ 60-250/mes.
on:
  schedule:
    - cron: '00 7 * * *'   # 07:00 UTC (~09:00 Madrid): cuotas del día (si el Worker no lo ha hecho ya)
    - cron: '40 22 * * *'  # 22:40 UTC: solo liquidar los partidos del día (gratis)
  workflow_dispatch:
    inputs:
      force:
        description: 'Pedir cuotas aunque ya se pidieran hoy (gasta créditos)'
        type: boolean
        default: false

permissions:
  contents: write

# dos disparos a la vez (Worker + cron) se ponen en cola: el 2.º ve las cuotas del 1.º y no gasta
concurrency:
  group: daily-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generar daily.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # amistosos de selecciones (api-sports.io) — opcional. Si no lo pones, se omiten.
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # vacío = lista del robot (Champions, Europa League, 5 grandes ligas, Mundial).
          # auto = las competiciones ACTIVAS más relevantes (ranking SPORT_PRIORITY).
          # Para fijar competiciones a mano: ODDS_SPORT: soccer_uefa_champs_league,soccer_brazil_campeonato
          ODDS_SPORT:
          # máximo de competiciones (= créditos) por día. El robot además lo baja solo si
          # el saldo no llega a fin de mes.
          ODDS_MAX: '8'
          ODDS_MIN_HOURS: '20'
          ODDS_FORCE: ${{ github.event.inputs.force }}
          # la ejecución de la noche solo liquida
          ODDS_MODE: ${{ github.event.schedule == '40 22 * * *' && 'scores' || '' }}
          ODDS_REGIONS: eu
          # Ventana de días hacia delante. En temporada normal 48-72h sobra; en
          # temporada muerta (junio, antes del Mundial) súbelo para captar más
          ODDS_WINDOW_HOURS: '48'
        run: node robot/fetch-daily.js
      - name: Commit si hay cambios
        run: |
          git config user.name  "mundial-value-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: refresh daily odds"
            # Sincroniza con lo último del repo ANTES de subir, para no chocar con
            # otros commits (deploys, ediciones tuyas). Reintenta si hace falta.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push rechazado, reintento $i…"; sleep 3
            done
          fi
